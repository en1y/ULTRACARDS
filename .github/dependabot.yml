version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # ponytail: one PR per ecosystem instead of one per dependency;
      # split into per-group rules if a bump ever needs to land alone.
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
