<th:block th:fragment="coach" xmlns:th="http://www.thymeleaf.org">
    <!-- Floating coach. Positioned absolutely inside .game-layout by guide-game.js,
         so the browser scrolls it with the board for free. It takes over the table
         (behind a scrim) while it has something to say, and gets out of the way
         entirely while you play — the mascot button calls it back. -->
    <div id="guide-coach-scrim" class="guide-coach-scrim" hidden></div>

    <button id="guide-coach-puck" class="guide-coach-puck" type="button"
            th:aria-label="#{guides.coach.title}" hidden>
        <img class="uc-icon" data-icon="guide_coach" data-icon-extension="png"
             th:src="@{/pics/light/guide_coach.png}" alt="" aria-hidden="true" />
    </button>

    <div id="guide-coach-bubble" class="guide-coach" role="status" aria-live="polite"
         th:aria-label="#{guides.coach.title}">
        <span class="guide-coach-tail" aria-hidden="true"></span>
        <span class="guide-coach-avatar" aria-hidden="true">
            <img class="uc-icon" data-icon="guide_coach" data-icon-extension="png"
                 th:src="@{/pics/light/guide_coach.png}" alt="" aria-hidden="true" />
        </span>
        <div class="guide-coach-say">
            <div class="guide-coach-text" id="guide-coach">Loading…</div>
            <p class="guide-hint" id="guide-hint" hidden th:text="#{guides.coach.playHint}">Double-click or drag the highlighted card to play it.</p>
            <div class="guide-coach-controls">
                <!-- Previous is rendered only when it can actually do something, so
                     the row never carries a dead button. -->
                <button class="btn" id="guide-previous" type="button" th:text="#{common.previous}" hidden>Previous</button>
                <button class="btn" id="guide-hide" type="button" th:text="#{guides.coach.hide}">Hide</button>
                <button class="btn btn-accent" id="guide-primary" type="button" th:text="#{guides.coach.start}">Start the game</button>
            </div>
        </div>
    </div>
</th:block>
