<!DOCTYPE html>
<html lang="en" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org" th:with="theme=${theme} ? ${theme} : 'dark'" th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{ui/fragments/head :: siteMetadata}"></th:block>
    <meta name="robots" content="noindex,follow">
    <title th:text="#{guides.pageTitle}">How to play · ULTRACARDS</title>
    <script th:src="@{/js/theme-preload.js}"></script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/ui/guides.css(v='0.3.5-20')}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>
<div th:replace="~{ui/fragments/header :: header}"></div>

<main class="guide-main">
    <section class="guide-hero container">
        <a class="guide-back" th:href="@{/guides}" th:text="#{guides.back}">← All guides</a>
        <h1 th:text="${gameName}">Poker</h1>
    </section>

    <section class="container">
        <div class="card guide-soon-card">
            <h2 th:text="#{guides.comingSoon.title}">Guide coming soon</h2>
            <p th:text="#{guides.comingSoon.copy(${gameName})}">We're still writing this guide. Check back soon!</p>
            <a class="btn btn-accent" th:href="@{/guides}" th:text="#{guides.back}">← All guides</a>
        </div>
    </section>
</main>

<div th:replace="~{ui/fragments/footer :: footer}"></div>
</body>
</html>
