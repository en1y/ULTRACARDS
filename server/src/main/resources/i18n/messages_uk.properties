guides.durak.title=Як грати в Дурака
guides.durak.intro=Позбудься карт раніше за всіх. Останній гравець із картами стає дурнем.
guides.durak.rule.setup=Кожен гравець отримує шість карт. Відкрита карта під колодою показує козир.
guides.durak.rule.attackTitle=Атака
guides.durak.rule.attack=Нападник починає з будь-якої карти. Підкидати можна лише карти, ранг яких уже є на столі.
guides.durak.rule.defenseTitle=Захист
guides.durak.rule.defense=Накрий карту атаки старшою картою тієї самої масті або будь-яким козирем. Козир можна побити лише старшим козирем.
guides.durak.rule.takeTitle=Взяття та переведення
guides.durak.rule.take=Якщо не можеш або не хочеш відбиватися, забери всі карти зі столу. Коли переведення ввімкнено, картою того самого рангу можна перевести всю атаку на наступного гравця — але лише поки ти ще не відбив жодної карти.
guides.durak.rule.turnFlow=Після успішного захисту карти зі столу скидаються. Потім усі добирають до шести карт: спочатку нападники, захисник останнім.
guides.durak.rule.winning=Коли колода спорожніє, гравці без карт виходять із гри. Останній гравець із картами програє як дурень.
guides.durak.mode.players=2–6 гравців
guides.durak.mode.decks=Колоди на 24, 36 або 54 карти
guides.durak.mode.options=За бажанням із джокерами, переведенням та підкиданням усіма гравцями
guides.durak.play=Знайти лобі для Дурака →
guides.durak.playIntro=П'ять коротких роздач, у кожній одна ідея — атака, захист, підкидання, забирання і переведення.
