guides.briskula.play.intro=Це приклад Брішкули проти ботів.
guides.treseta.play.intro=Це приклад Трешети проти ботів.
guides.mode.briskula.TWO_PLAYERS=Двоє гравців, по три карти. Набери понад 60 зі 120 очок, щоб узяти роздачу.
guides.mode.briskula.TWO_PLAYERS_FOUR_CARDS_IN_HAND_EACH=Двоє гравців із чотирма картами кожен, тож більше вибору в кожному раунді.
guides.mode.briskula.THREE_PLAYERS=Троє гравців, без команд — кожен сам за себе.
guides.mode.briskula.FOUR_PLAYERS_NO_TEAMS=Четверо гравців, без команд — перемагає найвищий особистий рахунок.
guides.mode.briskula.FOUR_PLAYERS_WITH_TEAMS=Четверо гравців у двох командах навпроти; партнери додають очки разом.
guides.mode.treseta.TWO_PLAYERS=Двоє гравців, по десять карт у повній грі, добираючи з колоди, доки вона не скінчиться.
guides.mode.treseta.THREE_PLAYERS=Троє гравців, по тринадцять карт; одну карту відкладають.
guides.mode.treseta.FOUR_PLAYERS_WITH_TEAMS=Четверо гравців у двох командах; партнери додають очки разом.
guides.mode.treseta.FOUR_PLAYERS_NO_TEAMS=Четверо гравців, без команд — перемагає найвищий рахунок.
guides.mode.treseta.TWO_PLAYERS_WITH_DECLARATIONS=Двоє гравців із заявами: бонусні очки за набори тузів, двійок, трійок або наполітану.
guides.mode.treseta.THREE_PLAYERS_WITH_DECLARATIONS=Троє гравців із заявами за особливі набори карт.
guides.mode.treseta.FOUR_PLAYERS_WITH_TEAMS_WITH_DECLARATIONS=Четверо гравців у командах, із заявами.
guides.mode.treseta.FOUR_PLAYERS_NO_TEAMS_WITH_DECLARATIONS=Четверо гравців, без команд, із заявами.
guides.briskula.rule.setup=Брішкула використовує колоду з 40 італійських карт — монети, кубки, мечі та палиці, кожна масть іде туз, 2–7, 11, 12, 13. Одну карту кладуть лицем угору, і її масть — козир на всю роздачу. Гравці отримують по 3 карти (один режим для двох роздає 4).
guides.briskula.rule.turnFlow=Кожен гравець кладе рівно одну карту за раунд, по черзі — по одній карті, скільки б їх не було в руці. Ходити в масть не обов’язково: можна зіграти будь-яку карту. Найсильніша карта забирає раунд і всі очки в ньому. Далі кожен добирає одну карту з колоди, першим — переможець раунду, і він же ходить у наступному.
guides.briskula.rule.strength=Козир б'є будь-яку не-козирну карту. Без козиря перемагає найвища карта завданої масті. Карта, що не в масть і не козир, не може виграти раунд. Порядок у масті: туз, 3, 13, 12, 11, потім 7, 6, 5, 4, 2.
guides.briskula.rule.valuesNote=У колоді загалом 120 очок.
guides.briskula.rule.winning=Додай очки в картах, які взяв ти чи твоя команда. Понад 60 зі 120 очок виграє роздачу.
guides.treseta.rule.setup=Трешета використовує ту саму колоду з 40 італійських карт. Козирної масті немає. У грі на 2 і 4 гравців кожен тримає 10 карт; гра на 3 роздає 13. Жодна карта не відкривається.
guides.treseta.rule.turnFlow=У кожному раунді гравець має ходити в завдану масть, якщо вона є; лише не маючи цієї масті можна грати будь-що. Найвища карта завданої масті виграє раунд і ходить наступною.
guides.treseta.rule.strength=Порядок у масті незвичний: 3, 2, туз, потім 13, 12, 11, і нарешті 7, 6, 5, 4. Трійка — найсильніша карта, а двійка б'є туза.
guides.treseta.rule.valuesNote=Це 11⅓ очка, за які борються щороздачі.
guides.treseta.rule.declarations=У режимах із заявами ти набираєш бонуси за набори: три або чотири тузи, двійки чи трійки, або наполітану (туз, двійка і трійка однієї масті). Три однакові чи наполітана — 3 очки; чотири однакові — 4.
guides.treseta.rule.winning=Порахуй очки у виграних картах, додай очко за останній раунд та заяви. Гравець або команда з більшою кількістю очок перемагає.
