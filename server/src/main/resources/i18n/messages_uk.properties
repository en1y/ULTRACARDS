guides.coach.playHint=Двічі клацни або перетягни виділену карту, щоб її зіграти.
guides.durak.playHint=Торкнися виділеної карти, а потім столу — або просто перетягни її туди.
guides.coach.mode=Режим гри
guides.scrollForRules=Прокрути до повних правил ↓
guides.controls.explainer=Це панель гравця — це ти: вона показує аватар, очки та сортування руки. Стрілки ліворуч і праворуч показують попередній раунд і повертають до поточного.
guides.play.demoNote=Коротка демогра триває лише хвилину.
guides.play.briskulaPreset=У твоїй наперед складеній руці є туз монет, а монети — козир. Використай його, коли бот ходить картою, яку ти не можеш побити.
guides.play.tresetaPreset=У твоїй наперед складеній руці є трійка, двійка й туз мечів. Ходи в масть мечів, коли її задано, і пам'ятай: 3 б'є 2, а 2 — туза.
guides.play.declarationPreset=У твоїй наперед складеній руці є наполітана: туз, двійка й трійка мечів. У режимі із заявами вона дає 3 бонусні очки.
guides.play.trumpExplain=Відкрита карта під колодою позначає козир. Її масть є козирною всю роздачу, а будь-який козир б’є кожну некозирну карту.
guides.play.declarationWhat=Заяви — це бонуси до першої зіграної карти: три або чотири тузи, двійки чи трійки, або наполітана (туз, двійка й трійка однієї масті).
guides.play.declarationHow=У свій перший хід торкнися туза, двійки й трійки мечів, потім натисни Підтвердити.
guides.play.declareNow=Перед ходом заяви наполітану: торкнися туза, двійки й трійки мечів, потім натисни Підтвердити.
guides.play.declared=Наполітану заявлено: +3 очки.
guides.play.lead=Твій хід, ти ходиш першим. Виділена карта — безпечний вибір: зіграй її або обери свою.
guides.play.follow=Твій хід. Ти маєш ходити в масть — виділена карта є вдалим вибором.
guides.play.followFree=Твій хід. У тебе немає цієї масті, тож грай будь-що; виділена карта — безпечний вибір.
guides.play.followBriskula=Твій хід. Не обов’язково ходити в масть — зіграй виділену карту або козир, щоб забрати очки.
guides.play.botTurn={0} ходить…
guides.play.wonTrick=Ти виграв раунд (+{0} очок)! Ходи наступним.
guides.play.wonTrump=Твій козир виграв раунд (+{0} очок)! Ходи наступним.
guides.play.lostTrick=Переможець раунду — {0}.
guides.play.trumpGone=Колода порожня — останньою витягли козир.
guides.play.deckEmpty=Колода порожня — більше немає що добирати, тож догравайте те, що маєте на руках.
guides.play.lastTrick=Останній раунд!
guides.play.resultWin=Ти виграв гру з {0} очками! Тепер ти готовий до справжньої гри!
guides.play.resultLose={0} виграв цю гру. Ти завершив із {1} очками. Спробуй ще раз і трохи зміни свої ходи!
guides.play.resultTie=Нічия. Ти завершив із {0} очками.
