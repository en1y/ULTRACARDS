guides.durak.step.notThisOne=Не ця — для цього уроку йди за тренером.
guides.durak.step.lessonDone=Урок пройдено. Далі наступний.
guides.durak.step.allDone=Це вся гра. Знайди лобі та зіграй по-справжньому.
guides.durak.step.attack.intro=Ти атакуєш. Завдання просте: поклади карту на стіл, щоб суперник її відбивав.
guides.durak.step.attack.trump=Карта під колодою задає козир. Козирі б'ють будь-яку іншу масть — бережи їх.
guides.durak.step.attack.play=Перетягни будь-яку карту на стіл. Перша карта в раунді може бути якою завгодно.
guides.durak.step.attack.beaten=Відбито. Захисник накрив твою карту старшою тієї ж масті.
guides.durak.step.attack.done=Додавати нічого — завершуй раунд. Відбиті карти вибувають з гри назавжди.
guides.durak.step.defend.intro=Тепер захищаєшся ти. На столі карта, і її треба відбити.
guides.durak.step.defend.higher=Відбий її старшою картою тієї ж масті — перетягни свою карту прямо на неї.
guides.durak.step.defend.trumped=Ось ще одна, і в цій масті в тебе немає нічого старшого.
guides.durak.step.defend.useTrump=Будь-який козир б'є будь-яку карту іншої масті. Зіграй козир.
guides.durak.step.defend.recap=Ось і весь захист: та сама масть, але старша, або козир. Відбив усе — раунд завершено.
guides.durak.step.take.intro=Інколи відбити те, що перед тобою, просто нічим.
guides.durak.step.take.stuck=У руці немає нічого, що б'є цю карту — ні старшої в масті, ні козиря.
guides.durak.step.take.press=Тоді забирай. Усі карти зі столу йдуть до тебе в руку, а атаку ти пропускаєш.
guides.durak.step.take.recap=Забрати — не програти, а виграти час. Але рука, що росте, і робить тебе дураком.
guides.durak.step.throwIn.intro=Утрьох інші можуть підкидати. Будь-який ранг, що вже на столі, дозволено підкинути.
guides.durak.step.throwIn.open=Відкрий раунд своєю дев'яткою.
guides.durak.step.throwIn.beaten=Накрито. Але дев'ятка лишається на столі, тож за нею може піти будь-яка інша дев'ятка.
guides.durak.step.throwIn.match=Підкинь другу дев'ятку — поклади її будь-де на стіл.
guides.durak.step.throwIn.recap=Так раунд і росте. Захисник мусить відбити кожну карту або забрати все.
guides.durak.step.rotate.intro=У цій роздачі переведення увімкнено. Замість захисту можна віддати всю атаку наступному гравцеві.
guides.durak.step.rotate.target=Ця пунктирна карта — ціль для переведення. Вона з'являється, лише поки переведення ще можливе.
guides.durak.step.rotate.play=Поклади на неї карту того ж рангу, щоб перевести атаку.
guides.durak.step.rotate.recap=Тепер захищаються вони, а не ти. Перевести можна лише поки ти не відбив жодної карти.

# Guide fake-game v2 (mode selector, phase coaching)
guides.coach.title=Твій тренер
guides.coach.start=Почати гру
