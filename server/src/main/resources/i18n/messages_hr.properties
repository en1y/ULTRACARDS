guides.briskula.play.intro=Ovo je primjer Briškule protiv botova.
guides.treseta.play.intro=Ovo je primjer Trešete protiv botova.
guides.mode.briskula.TWO_PLAYERS=Dva igrača, po tri karte. Za pobjedu ti treba više od 60 od ukupno 120 bodova.
guides.mode.briskula.TWO_PLAYERS_FOUR_CARDS_IN_HAND_EACH=Dva igrača s po četiri karte, pa imaš više izbora u svakoj rundi.
guides.mode.briskula.THREE_PLAYERS=Tri igrača, bez ekipa — svatko za sebe.
guides.mode.briskula.FOUR_PLAYERS_NO_TEAMS=Četiri igrača, bez ekipa — pobjeđuje najviši osobni rezultat.
guides.mode.briskula.FOUR_PLAYERS_WITH_TEAMS=Četiri igrača u dvije ekipe sučelice; suigrači zbrajaju bodove.
guides.mode.treseta.TWO_PLAYERS=Dva igrača, po deset karata; nakon svake runde vučete iz špila dok se ne isprazni.
guides.mode.treseta.THREE_PLAYERS=Tri igrača, po trinaest karata; jedna karta se odvaja.
guides.mode.treseta.FOUR_PLAYERS_WITH_TEAMS=Četiri igrača u dvije ekipe; suigrači zbrajaju bodove.
guides.mode.treseta.FOUR_PLAYERS_NO_TEAMS=Četiri igrača, bez ekipa — pobjeđuje najviši rezultat.
guides.mode.treseta.TWO_PLAYERS_WITH_DECLARATIONS=Dva igrača, sa zvanjima: dodatni bodovi za skupove asova, dvica, trica ili napolitanu.
guides.mode.treseta.THREE_PLAYERS_WITH_DECLARATIONS=Tri igrača, sa zvanjima za posebne skupove karata.
guides.mode.treseta.FOUR_PLAYERS_WITH_TEAMS_WITH_DECLARATIONS=Četiri igrača u ekipama, sa zvanjima.
guides.mode.treseta.FOUR_PLAYERS_NO_TEAMS_WITH_DECLARATIONS=Četiri igrača, bez ekipa, sa zvanjima.
guides.briskula.rule.setup=Briškula se igra špilom od 40 talijanskih karata — dinari, kupe, špade i bataki, a svaka boja ide as, 2–7, 11, 12, 13. Jedna karta okrene se licem gore i njezina boja je adut cijelu partiju. Svatko dobiva po 3 karte (u jednoj vrsti za dvoje dijele se 4).
guides.briskula.rule.turnFlow=Svatko u rundi baci točno jednu kartu, redom — po jednu karti, bez obzira koliko ih držiš u ruci. Ne moraš pratiti boju: možeš baciti bilo koju kartu. Najjača karta uzima rundu i sve bodove u njoj. Zatim svatko vuče po jednu kartu iz špila, prvi pobjednik runde, i on izlazi u sljedećoj.
guides.briskula.rule.strength=Adut je jači od svake karte druge boje. Ako aduta nema, rundu uzima najviša karta boje koja je izašla. Karta koja nije ni u toj boji ni adut ne može uzeti rundu. Redoslijed unutar boje: as, 3, 13, 12, 11, pa 7, 6, 5, 4, 2.
guides.briskula.rule.valuesNote=U špilu je ukupno 120 bodova.
guides.briskula.rule.winning=Zbroji bodove karata koje ste ti ili tvoja ekipa uzeli. Više od 60 od 120 bodova znači pobjedu.
guides.treseta.rule.setup=Trešeta se igra istim špilom od 40 talijanskih karata. Aduta nema. U igri za 2 i 4 igrača svatko drži 10 karata, a u igri za 3 njih 13. Nijedna karta se ne okreće.
guides.treseta.rule.turnFlow=U svakoj rundi moraš pratiti boju koja je izašla ako je imaš; ako je nemaš, baci što god hoćeš. Rundu uzima najviša karta te boje i taj igrač izlazi sljedeći.
guides.treseta.rule.strength=Redoslijed unutar boje je neobičan: 3, 2, as, pa 13, 12, 11 i na kraju 7, 6, 5, 4. Trica je najjača, a dvica je jača od asa.
guides.treseta.rule.valuesNote=U svakoj partiji dijeli se 11⅓ bodova.
guides.treseta.rule.declarations=U vrstama sa zvanjima dobivaš dodatne bodove za skupove: tri ili četiri asa, dvice ili trice, ili napolitanu (as, dvica i trica iste boje). Tri iste karte ili napolitana nose 3 boda, četiri iste nose 4.
guides.treseta.rule.winning=Zbroji bodove karata koje si uzeo, dodaj bod za zadnju rundu i zvanja. Pobjeđuje igrač ili ekipa s više bodova.
