guides.durak.intro=Ostani bez karata prije svih ostalih. Posljednji igrač s kartama je durak.
guides.durak.rule.setup=Svaki igrač dobiva šest karata. Otvorena karta ispod špila pokazuje adut.
guides.durak.rule.attackTitle=Napad
guides.durak.rule.attack=Napadač izlazi bilo kojom kartom. Dodatne se karte smiju ubaciti samo ako se njihova vrijednost već nalazi na stolu.
guides.durak.rule.defenseTitle=Obrana
guides.durak.rule.defense=Pokrij napadačku kartu višom kartom iste boje ili bilo kojim adutom. Adut može pobijediti samo viši adut.
guides.durak.rule.takeTitle=Uzimanje i prosljeđivanje
guides.durak.rule.take=Ako se ne možeš ili ne želiš braniti, uzmi sve karte sa stola. Kad je prosljeđivanje uključeno, kartom iste vrijednosti cijeli napad prelazi sljedećem igraču — ali samo dok još nisi pobijedio nijednu kartu.
guides.durak.rule.turnFlow=Nakon uspješne obrane karte sa stola idu u odbačene. Zatim svi vuku do šest karata: najprije napadači, a branitelj zadnji.
guides.durak.rule.winning=Kad se špil isprazni, sigurni su igrači koji ostanu bez karata. Posljednji igrač s kartama gubi kao durak.
guides.durak.mode.players=2–6 igrača
guides.durak.mode.decks=Špilovi od 24, 36 ili 54 karte
guides.durak.mode.options=Izborno s džokerima, prosljeđivanjem i ubacivanjem svih igrača
guides.durak.play=Pronađi Durak lobi →
guides.durak.playIntro=Pet kratkih djeljenja, svako s jednom idejom — napad, obrana, dobacivanje, uzimanje i prosljeđivanje.
guides.durak.lessonLabel=Lekcija
guides.durak.nextLesson=Sljedeća lekcija
guides.durak.restart=Počni ispočetka
guides.durak.lesson.attack=1 · Napad
guides.durak.lesson.defend=2 · Obrana
guides.durak.lesson.take=3 · Uzimanje
guides.durak.lesson.throwIn=4 · Dobacivanje
guides.durak.lesson.rotate=5 · Prosljeđivanje
guides.durak.step.notThisOne=Ne ta — za ovu lekciju slijedi trenera.
guides.durak.step.lessonDone=Lekcija gotova. Idemo na sljedeću.
guides.durak.step.allDone=To je cijela igra. Nađi lobi i odigraj je pravo.
guides.durak.step.attack.intro=Ti napadaš. Zadatak je jednostavan: stavi kartu na stol koju protivnik mora pobijediti.
guides.durak.step.attack.trump=Karta ispod špila određuje aduta. Aduti tuku svaku drugu boju — čuvaj ih za pravi trenutak.
guides.durak.step.attack.play=Povuci bilo koju kartu na stol. Prva karta u rundi može biti bilo koja.
guides.durak.step.attack.beaten=Pobijeđena. Branitelj ju je pokrio jačom kartom iste boje.
guides.durak.step.attack.done=Nemaš što dodati — završi rundu. Pobijeđene karte zauvijek izlaze iz igre.
guides.durak.step.defend.intro=Sada se braniš. Karta je na stolu i na tebi je da je pobijediš.
guides.durak.step.defend.higher=Pobijedi je jačom kartom iste boje — povuci svoju kartu ravno na njezinu.
guides.durak.step.defend.trumped=Evo još jedne, a u toj boji nemaš ništa jače.
guides.durak.step.defend.useTrump=Svaki adut tuče svaku kartu druge boje. Odigraj aduta.
guides.durak.step.defend.recap=To je obrana: ista boja ali jače, ili adut. Pobijediš sve i runda je gotova.
guides.durak.step.take.intro=Ponekad jednostavno ne možeš pobijediti ono što je pred tobom.
guides.durak.step.take.stuck=Ništa u tvojoj ruci ne tuče tu kartu — ni jača u boji, ni adut.
guides.durak.step.take.press=Onda uzimaš. Sve karte sa stola idu u tvoju ruku, a napad preskačeš.
guides.durak.step.take.recap=Uzimanje nije poraz, nego kupovina vremena. Ali ruka koja stalno raste vodi do toga da budeš durak.
guides.durak.step.throwIn.intro=U troje ostali mogu dobacivati. Svaka vrijednost koja je već na stolu smije se dobaciti.
guides.durak.step.throwIn.open=Otvori rundu svojom devetkom.
guides.durak.step.throwIn.beaten=Pokrivena. Devetka je i dalje na stolu, pa smije doći svaka druga devetka.
guides.durak.step.throwIn.match=Dobaci svoju drugu devetku — spusti je bilo gdje na stol.
guides.durak.step.throwIn.recap=Tako runda raste. Branitelj mora pobijediti svaku kartu ili uzeti sve.
guides.durak.step.rotate.intro=Ovdje je prosljeđivanje uključeno. Umjesto obrane možeš cijeli napad predati sljedećem igraču.
guides.durak.step.rotate.target=Ta isprekidana karta je meta za prosljeđivanje. Pojavljuje se samo dok je prosljeđivanje još moguće.
guides.durak.step.rotate.play=Spusti na nju kartu iste vrijednosti da proslijediš napad.
guides.durak.step.rotate.recap=Sada se brane oni, ne ti. Proslijediti smiješ samo dok nisi pobijedio nijednu kartu.

