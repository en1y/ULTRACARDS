guides.controls.explainer=Ova pločica si ti: pokazuje tvoj avatar, bodove i slaganje karata. Strelicama lijevo i desno pogledaj prošlu rundu pa se vrati na trenutnu.
guides.play.demoNote=Kratka demo partija traje samo minutu.
guides.play.briskulaPreset=U ruci već imaš asa dinara, a dinari su adut. Baci ga kad bot izađe kartom koju inače ne možeš uzeti.
guides.play.tresetaPreset=U ruci već imaš tricu, dvicu i asa špada. Prati špade kad izađu i zapamti: trica je jača od dvice, a dvica od asa.
guides.play.declarationPreset=U ruci već imaš napolitanu — asa, dvicu i tricu špada. U igri sa zvanjima to nosi 3 boda više.
guides.play.trumpExplain=Okrenuta karta ispod špila pokazuje adut. Ta boja je adut cijelu partiju, a svaki adut je jači od bilo koje karte druge boje.
guides.play.declarationWhat=Zvanja su dodatni bodovi koje prijaviš prije svoje prve karte: tri ili četiri asa, dvice ili trice, ili napolitana (as, dvica i trica iste boje).
guides.play.declarationHow=U prvom potezu dodirni asa, dvicu i tricu špada pa pritisni Potvrdi.
guides.play.declareNow=Prije nego što baciš kartu, zovi napolitanu: dodirni asa, dvicu i tricu špada pa pritisni Potvrdi.
guides.play.declared=Zvana napolitana: +3 boda.
guides.play.lead=Ti izlaziš. Istaknuta karta je siguran izbor — baci nju ili izaberi svoju.
guides.play.follow=Ti si na potezu. Moraš pratiti boju — istaknuta karta je dobar izbor.
guides.play.followFree=Ti si na potezu. Nemaš tu boju, pa možeš baciti što god; istaknuta karta je siguran izbor.
guides.play.followBriskula=Ti si na potezu. Ne moraš pratiti boju — baci istaknutu kartu ili adutom uzmi bodove.
guides.play.botTurn={0} igra…
guides.play.wonTrick=Runda je tvoja (+{0} bodova)! Sad ti izlaziš.
guides.play.wonTrump=Adut ti je donio rundu (+{0} bodova)! Sad ti izlaziš.
guides.play.lostTrick={0} uzima rundu.
guides.play.trumpGone=Špil je prazan — zadnja izvučena karta bio je adut.
guides.play.deckEmpty=Špil je prazan — više se ne vuče, pa odigrajte ono što vam je ostalo u ruci.
guides.play.lastTrick=Zadnja runda!
guides.play.resultWin=Pobjeda s {0} bodova! Sad možeš u pravu igru.
guides.play.resultLose={0} uzima ovu partiju. Ti si na {1} bodova. Probaj opet i promijeni koji potez!
